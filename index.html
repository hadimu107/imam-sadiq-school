<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدرسه بین المللی امام صادق (ع)</title>

  <style>

    /* =====================================
       تنظیمات اصلی
    ===================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      overflow-x: hidden;
    }


    /* =====================================
       رنگ اصلی
       
       نوار و موج دقیقاً همین رنگ هستند
    ===================================== */

    :root {
      --orange: #E67E22;
    }


    /* =====================================
       نوار نارنجی ثابت
    ===================================== */

    .top-bar {
      position: fixed;

      top: 0;
      right: 0;

      width: 100%;
      height: 75px;

      background: var(--orange);

      z-index: 9999;

      /* هیچ سایه یا خط سفید ندارد */
      border: none;
      box-shadow: none;
    }


    /* =====================================
       لوگو
    ===================================== */

    .logo {
      position: absolute;

      top: 7px;
      right: 45px;

      width: 50px;
      max-width: 50px;

      height: auto;

      object-fit: contain;

      z-index: 10000;
    }


    /* =====================================
       فضای نوار ثابت
    ===================================== */

    .top-space {
      width: 100%;
      height: 75px;

      background: var(--orange);
    }


    /* =====================================
       بخش موج
       
       ثابت نیست
       همراه صفحه اسکرول می‌شود
    ===================================== */

    .wave-section {
      position: relative;

      width: 100%;
      height: 115px;

      background: var(--orange);

      overflow: hidden;

      z-index: 10;

      /* هیچ فاصله‌ای با نوار ندارد */
      margin: 0;
      padding: 0;

      border: none;
    }


    /* =====================================
       موج اول
       
       دقیقاً همان رنگ نوار
    ===================================== */

    .wave-one {
      position: absolute;

      left: -5%;
      bottom: 35px;

      width: 110%;
      height: 90px;

      background: var(--orange);

      clip-path: polygon(
        0% 30%,
        10% 40%,
        20% 55%,
        30% 62%,
        40% 50%,
        50% 38%,
        60% 46%,
        70% 58%,
        80% 48%,
        90% 35%,
        100% 42%,
        100% 100%,
        0% 100%
      );

      border: none;

      z-index: 1;
    }


    /* =====================================
       موج دوم
       
       دقیقاً همان رنگ نوار
    ===================================== */

    .wave-two {
      position: absolute;

      left: -5%;
      bottom: 0;

      width: 110%;
      height: 80px;

      background: var(--orange);

      clip-path: polygon(
        0% 38%,
        10% 48%,
        20% 60%,
        30% 52%,
        40% 40%,
        50% 50%,
        60% 62%,
        70% 50%,
        80% 40%,
        90% 47%,
        100% 42%,
        100% 100%,
        0% 100%
      );

      border: none;

      z-index: 2;
    }


    /* =====================================
       محتوای اصلی
    ===================================== */

    .content {
      position: relative;

      width: 100%;

      min-height: 1400px;

      background: #ffffff;

      z-index: 20;
    }


    /* =====================================
       محتوای صفحه
    ===================================== */

    .content-inner {
      width: 100%;

      padding: 40px 20px;

      text-align: center;
    }


    .content-inner h1 {
      color: var(--orange);

      font-size: 28px;

      margin-bottom: 20px;
    }


    .content-inner p {
      color: #555555;

      font-size: 18px;

      line-height: 2;
    }


    /* =====================================
       فضای تست اسکرول
    ===================================== */

    .scroll-space {
      height: 1000px;
    }


    /* =====================================
       پایان صفحه
    ===================================== */

    .end-box {
      width: 100%;

      padding: 40px 20px;

      background: var(--orange);

      color: #ffffff;

      font-size: 20px;

      border-radius: 20px 20px 0 0;
    }


    /* =====================================
       تبلت و گوشی
    ===================================== */

    @media (max-width: 768px) {

      .top-bar {
        height: 65px;
      }

      .top-space {
        height: 65px;
      }

      .logo {
        width: 42px;
        max-width: 42px;

        top: 6px;
        right: 20px;
      }

      .wave-section {
        height: 95px;
      }

      .wave-one {
        height: 75px;
        bottom: 30px;
      }

      .wave-two {
        height: 68px;
        bottom: 0;
      }

      .content-inner h1 {
        font-size: 23px;
      }

      .content-inner p {
        font-size: 16px;
      }

    }


    /* =====================================
       گوشی کوچک
    ===================================== */

    @media (max-width: 480px) {

      .top-bar {
        height: 60px;
      }

      .top-space {
        height: 60px;
      }

      .logo {
        width: 36px;
        max-width: 36px;

        top: 5px;
        right: 15px;
      }

      .wave-section {
        height: 80px;
      }

      .wave-one {
        height: 65px;
        bottom: 25px;
      }

      .wave-two {
        height: 58px;
        bottom: 0;
      }

      .content-inner {
        padding: 30px 15px;
      }

      .content-inner h1 {
        font-size: 21px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       نوار ثابت
    ===================================== -->

  <header class="top-bar">

    <img
      src="logo.png"
      class="logo"
      alt="مدرسه بین المللی امام صادق (ع)"
    >

  </header>


  <!-- =====================================
       فضای نارنجی زیر نوار
       
       این قسمت هم نارنجی است
       تا هیچ خط سفیدی ایجاد نشود
    ===================================== -->

  <div class="top-space"></div>


  <!-- =====================================
       موج‌ها
       
       این قسمت ثابت نیست
    ===================================== -->

  <section class="wave-section">

    <div class="wave-one"></div>

    <div class="wave-two"></div>

  </section>


  <!-- =====================================
       محتوای صفحه
    ===================================== -->

  <main class="content">

    <div class="content-inner">

      <h1>
        مدرسه بین المللی امام صادق (ع)
      </h1>

      <p>
        به وب‌سایت مدرسه بین المللی امام صادق (ع) خوش آمدید
      </p>


      <!-- فضای تست اسکرول -->

      <div class="scroll-space"></div>


      <!-- پایان صفحه -->

      <div class="end-box">
        پایان صفحه
      </div>

    </div>

  </main>


</body>

</html>
