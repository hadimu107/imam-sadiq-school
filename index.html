<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدرسه بین المللی امام صادق ع</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #fff;
      font-family: Tahoma, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* =========================
       HERO / HEADER
    ========================= */

    .hero {
      position: relative;
      width: 100%;
      height: 260px;
      background: #429da4;
      overflow: hidden;
    }

    /* موج اصلی پایین هدر */
    .hero-wave {
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 115px;
      z-index: 1;
    }

    .hero-wave svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* موج کم‌رنگ اول */
    .wave-light {
      position: absolute;
      left: -5%;
      bottom: 55px;
      width: 110%;
      height: 80px;
      background: rgba(255, 255, 255, 0.07);
      clip-path: polygon(
        0 20%,
        15% 50%,
        32% 35%,
        48% 55%,
        65% 45%,
        82% 20%,
        100% 35%,
        100% 100%,
        0 100%
      );
      z-index: 0;
    }

    /* موج دوم */
    .wave-light-2 {
      position: absolute;
      left: -5%;
      bottom: 25px;
      width: 110%;
      height: 80px;
      background: rgba(255, 255, 255, 0.08);
      clip-path: polygon(
        0 15%,
        20% 35%,
        40% 25%,
        60% 55%,
        78% 30%,
        100% 45%,
        100% 100%,
        0 100%
      );
      z-index: 0;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      position: absolute;
      top: 5px;
      right: 55px;
      width: 145px;
      height: auto;
      object-fit: contain;
      z-index: 5;
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      min-height: calc(100vh - 260px);
      background: #fff;
      position: relative;
      z-index: 2;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {

      .hero {
        height: 210px;
      }

      .logo {
        width: 105px;
        right: 25px;
        top: 8px;
      }

      .hero-wave {
        height: 85px;
      }

      .wave-light {
        bottom: 40px;
      }

      .wave-light-2 {
        bottom: 15px;
      }

      .content {
        min-height: calc(100vh - 210px);
      }
    }

    @media (max-width: 480px) {

      .hero {
        height: 180px;
      }

      .logo {
        width: 90px;
        right: 18px;
        top: 7px;
      }

      .hero-wave {
        height: 70px;
      }

      .wave-light {
        bottom: 30px;
      }

      .wave-light-2 {
        bottom: 8px;
      }

      .content {
        min-height: calc(100vh - 180px);
      }
    }
  </style>
</head>

<body>

  <!-- صفحه اول -->
  <header class="hero">

    <!-- لوگو -->
    <img
      class="logo"
      src="logo.png"
      alt="مدرسه بین المللی امام صادق ع"
    >

    <!-- موج های کم رنگ -->
    <div class="wave-light"></div>
    <div class="wave-light-2"></div>

    <!-- موج سفید پایین -->
    <div class="hero-wave">
      <svg
        viewBox="0 0 1600 160"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="
            M0,70
            C180,85 320,110 500,105
            C720,100 850,75 1040,55
            C1240,34 1400,18 1600,20
            L1600,160
            L0,160
            Z
          "
          fill="#ffffff"
        />
      </svg>
    </div>

  </header>

  <!-- ادامه صفحه اول -->
  <main class="content">
    <!-- محتوای صفحه اصلی را اینجا قرار بده -->
  </main>

</body>
</html>
