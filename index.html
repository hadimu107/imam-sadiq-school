<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدرسه بین المللی امام صادق (ع)</title>

  <style>

    /* =====================================
       تنظیمات اصلی
    ===================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      overflow-x: hidden;
    }


    /* =====================================
       رنگ اصلی سایت
       نوار و موج دقیقاً یک رنگ هستند
    ===================================== */

    :root {
      --orange: #E67E22;
    }


    /* =====================================
       نوار نارنجی ثابت
    ===================================== */

    .top-bar {
      position: fixed;

      top: 0;
      right: 0;

      width: 100%;
      height: 75px;

      background: var(--orange);

      z-index: 9999;
    }


    /* =====================================
       لوگو
    ===================================== */

    .logo {
      position: absolute;

      top: 7px;
      right: 45px;

      width: 50px;
      max-width: 50px;

      height: auto;

      object-fit: contain;

      z-index: 10000;
    }


    /* =====================================
       فضای مربوط به نوار ثابت
    ===================================== */

    .top-space {
      width: 100%;
      height: 75px;
    }


    /* =====================================
       بخش موج
       
       FIXED نیست
       بنابراین با اسکرول حرکت می‌کند
    ===================================== */

    .wave-section {
      position: relative;

      width: 100%;
      height: 115px;

      overflow: hidden;

      background: #ffffff;

      z-index: 10;
    }


    /* =====================================
       موج اول
       
       دقیقاً همان رنگ نوار
    ===================================== */

    .wave-one {
      position: absolute;

      left: -5%;
      bottom: 40px;

      width: 110%;
      height: 90px;

      background: var(--orange);

      clip-path: polygon(
        0% 28%,
        10% 38%,
        20% 52%,
        30% 60%,
        40% 48%,
        50% 38%,
        60% 45%,
        70% 55%,
        80% 48%,
        90% 35%,
        100% 42%,
        100% 100%,
        0% 100%
      );

      z-index: 1;
    }


    /* =====================================
       موج دوم
       
       دقیقاً همان رنگ نوار
    ===================================== */

    .wave-two {
      position: absolute;

      left: -5%;
      bottom: 5px;

      width: 110%;
      height: 85px;

      background: var(--orange);

      clip-path: polygon(
        0% 35%,
        10% 45%,
        20% 58%,
        30% 50%,
        40% 38%,
        50% 48%,
        60% 60%,
        70% 48%,
        80% 38%,
        90% 45%,
        100% 40%,
        100% 100%,
        0% 100%
      );

      z-index: 2;
    }


    /* =====================================
       قسمت سفید بین موج‌ها / پایین موج
    ===================================== */

    .white-wave {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 70px;

      z-index: 5;
      pointer-events: none;
    }

    .white-wave svg {
      display: block;

      width: 100%;
      height: 100%;
    }


    /* =====================================
       محتوای اصلی
    ===================================== */

    .content {
      position: relative;

      width: 100%;
      min-height: 1400px;

      background: #ffffff;

      z-index: 20;
    }


    /* =====================================
       محتوای تستی
    ===================================== */

    .content-inner {
      width: 100%;

      padding: 40px 20px;

      text-align: center;
    }


    .content-inner h1 {
      color: var(--orange);

      font-size: 28px;

      margin-bottom: 20px;
    }


    .content-inner p {
      color: #555555;

      font-size: 18px;

      line-height: 2;
    }


    /* =====================================
       فضای بلند برای تست اسکرول
    ===================================== */

    .scroll-space {
      height: 900px;
    }


    /* =====================================
       پایان صفحه
    ===================================== */

    .end-box {
      width: 100%;

      padding: 40px 20px;

      background: var(--orange);

      color: #ffffff;

      font-size: 20px;

      border-radius: 20px 20px 0 0;
    }


    /* =====================================
       تبلت و گوشی
    ===================================== */

    @media (max-width: 768px) {

      .top-bar {
        height: 65px;
      }

      .top-space {
        height: 65px;
      }

      .logo {
        width: 42px;
        max-width: 42px;

        top: 6px;
        right: 20px;
      }

      .wave-section {
        height: 95px;
      }

      .wave-one {
        height: 75px;
        bottom: 32px;
      }

      .wave-two {
        height: 70px;
        bottom: 4px;
      }

      .content-inner h1 {
        font-size: 23px;
      }

      .content-inner p {
        font-size: 16px;
      }

    }


    /* =====================================
       گوشی کوچک
    ===================================== */

    @media (max-width: 480px) {

      .top-bar {
        height: 60px;
      }

      .top-space {
        height: 60px;
      }

      .logo {
        width: 36px;
        max-width: 36px;

        top: 5px;
        right: 15px;
      }

      .wave-section {
        height: 80px;
      }

      .wave-one {
        height: 65px;
        bottom: 27px;
      }

      .wave-two {
        height: 60px;
        bottom: 3px;
      }

      .content-inner {
        padding: 30px 15px;
      }

      .content-inner h1 {
        font-size: 21px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       نوار ثابت
  ====================================== -->

  <header class="top-bar">

    <img
      src="logo.png"
      class="logo"
      alt="مدرسه بین المللی امام صادق (ع)"
    >

  </header>


  <!-- =====================================
       فضای نوار ثابت
  ====================================== -->

  <div class="top-space"></div>


  <!-- =====================================
       موج‌ها
       
       ثابت نیستند
    ====================================== -->

  <section class="wave-section">

    <!-- موج اول -->

    <div class="wave-one"></div>


    <!-- موج دوم -->

    <div class="wave-two"></div>


    <!-- سفید کردن قسمت پایین -->

    <div class="white-wave">

      <svg
        viewBox="0 0 1600 160"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          d="
            M0,90
            C180,75 320,65 500,72
            C700,80 850,95 1040,82
            C1240,68 1410,45 1600,50
            L1600,160
            L0,160
            Z
          "
          fill="#ffffff"
        />

      </svg>

    </div>

  </section>


  <!-- =====================================
       محتوای صفحه
  ====================================== -->

  <main class="content">

    <div class="content-inner">

      <h1>
        مدرسه بین المللی امام صادق (ع)
      </h1>

      <p>
        به وب‌سایت مدرسه بین المللی امام صادق (ع) خوش آمدید
      </p>


      <!-- فضای تست اسکرول -->

      <div class="scroll-space"></div>


      <!-- انتهای صفحه -->

      <div class="end-box">
        پایان صفحه
      </div>

    </div>

  </main>


</body>

</html>
