<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدرسه بین المللی امام صادق (ع)</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      overflow-x: hidden;
    }


    /* =========================
       هدر نارنجی
    ========================= */

    .hero {
      position: relative;
      width: 100%;
      height: 200px;

      background: #E67E22;

      overflow: hidden;
    }


    /* =========================
       موج روشن اول
    ========================= */

    .wave-light {
      position: absolute;

      left: -5%;
      bottom: 50px;

      width: 110%;
      height: 90px;

      background: rgba(255, 255, 255, 0.08);

      clip-path: polygon(
        0% 20%,
        12% 35%,
        25% 55%,
        40% 45%,
        55% 60%,
        70% 45%,
        85% 25%,
        100% 35%,
        100% 100%,
        0% 100%
      );

      z-index: 1;
    }


    /* =========================
       موج روشن دوم
    ========================= */

    .wave-light-2 {
      position: absolute;

      left: -5%;
      bottom: 15px;

      width: 110%;
      height: 90px;

      background: rgba(255, 255, 255, 0.10);

      clip-path: polygon(
        0% 30%,
        15% 45%,
        30% 35%,
        45% 50%,
        60% 45%,
        75% 30%,
        90% 40%,
        100% 35%,
        100% 100%,
        0% 100%
      );

      z-index: 2;
    }


    /* =========================
       موج سفید پایین
    ========================= */

    .hero-wave {
      position: absolute;

      left: 0;
      bottom: -1px;

      width: 100%;
      height: 110px;

      z-index: 3;
    }

    .hero-wave svg {
      display: block;
      width: 100%;
      height: 100%;
    }


    /* =========================
       لوگو - کامپیوتر
    ========================= */

    .logo {
      position: absolute;

      top: 12px;
      right: 50px;

      width: 40
      max-width: 40px;

      height: auto;

      object-fit: contain;

      z-index: 100;
    }


    /* =========================
       قسمت سفید صفحه
    ========================= */

    .content {
      position: relative;

      width: 100%;

      min-height: calc(100vh - 250px);

      background: #ffffff;

      z-index: 5;
    }


    /* =========================
       تبلت و گوشی
    ========================= */

    @media (max-width: 768px) {

      .hero {
        height: 210px;
      }

      .logo {
        width: 35px;
        max-width: 35px;

        top: 8px;
        right: 20px;
      }

      .hero-wave {
        height: 90px;
      }

      .wave-light {
        bottom: 40px;
      }

      .wave-light-2 {
        bottom: 10px;
      }

      .content {
        min-height: calc(100vh - 210px);
      }
    }


    /* =========================
       گوشی کوچک
    ========================= */

    @media (max-width: 480px) {

      .hero {
        height: 185px;
      }

      .logo {
        width: 38px;
        max-width: 38px;

        top: 7px;
        right: 15px;
      }

      .hero-wave {
        height: 75px;
      }

      .wave-light {
        bottom: 30px;
      }

      .wave-light-2 {
        bottom: 5px;
      }

      .content {
        min-height: calc(100vh - 185px);
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       صفحه اول
  ========================== -->

  <header class="hero">


    <!-- لوگو -->

    <img
      src="logo.png"
      class="logo"
      alt="مدرسه بین المللی امام صادق (ع)"
    >


    <!-- موج‌های روشن -->

    <div class="wave-light"></div>

    <div class="wave-light-2"></div>


    <!-- موج سفید اصلی -->

    <div class="hero-wave">

      <svg
        viewBox="0 0 1600 160"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          d="
            M0,65
            C180,80 320,105 500,102
            C700,100 850,78 1040,58
            C1240,38 1410,18 1600,20
            L1600,160
            L0,160
            Z
          "
          fill="#ffffff"
        />

      </svg>

    </div>

  </header>


  <!-- =========================
       محتوای صفحه اول
  ========================== -->

  <main class="content">

  </main>


</body>

</html>
