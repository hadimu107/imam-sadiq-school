<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدرسه بین المللی امام صادق (ع)</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      overflow-x: hidden;
    }


    /* =========================
       نوار نارنجی ثابت
    ========================= */

    .top-bar {
      position: fixed;

      top: 0;
      right: 0;

      width: 100%;
      height: 75px;

      background: #E67E22;

      z-index: 9999;
    }


    /* =========================
       لوگو
    ========================= */

    .logo {
      position: absolute;

      top: 6px;
      right: 45px;

      width: 50px;
      max-width: 50px;

      height: auto;

      object-fit: contain;

      z-index: 10000;
    }


    /* =========================
       فضای نوار ثابت
    ========================= */

    .top-space {
      width: 100%;
      height: 75px;
    }


    /* =========================
       قسمت موج
       ثابت نیست
    ========================= */

    .wave-section {
      position: relative;

      width: 100%;
      height: 100px;

      overflow: hidden;

      background: #ffffff;

      z-index: 10;
    }


    /* =========================
       موج نارنجی اول
       پررنگ‌تر
    ========================= */

    .wave-light {
      position: absolute;

      left: -5%;
      bottom: 35px;

      width: 110%;
      height: 80px;

      background: rgba(230, 126, 34, 0.30);

      clip-path: polygon(
        0% 25%,
        12% 40%,
        25% 55%,
        40% 42%,
        55% 58%,
        70% 43%,
        85% 25%,
        100% 35%,
        100% 100%,
        0% 100%
      );

      z-index: 1;
    }


    /* =========================
       موج نارنجی دوم
       پررنگ‌تر
    ========================= */

    .wave-light-2 {
      position: absolute;

      left: -5%;
      bottom: 8px;

      width: 110%;
      height: 70px;

      background: rgba(230, 126, 34, 0.45);

      clip-path: polygon(
        0% 30%,
        15% 45%,
        30% 35%,
        45% 50%,
        60% 42%,
        75% 30%,
        90% 40%,
        100% 35%,
        100% 100%,
        0% 100%
      );

      z-index: 2;
    }


    /* =========================
       موج سفید
    ========================= */

    .white-wave {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 100%;

      z-index: 5;
    }

    .white-wave svg {
      display: block;

      width: 100%;
      height: 100%;
    }


    /* =========================
       محتوای اصلی
    ========================= */

    .content {
      position: relative;

      width: 100%;

      min-height: 1300px;

      background: #ffffff;

      z-index: 20;
    }


    /* =========================
       متن صفحه
    ========================= */

    .content-inner {
      width: 100%;

      padding: 40px 20px;

      text-align: center;
    }


    .content-inner h1 {
      color: #E67E22;

      font-size: 28px;

      margin-bottom: 20px;
    }


    .content-inner p {
      color: #555555;

      font-size: 18px;

      line-height: 2;
    }


    /* =========================
       فضای زیاد برای اسکرول
    ========================= */

    .scroll-space {
      height: 900px;
    }


    /* =========================
       انتهای صفحه
    ========================= */

    .end-box {
      width: 100%;

      padding: 40px 20px;

      background: #E67E22;

      color: #ffffff;

      font-size: 20px;

      border-radius: 20px 20px 0 0;
    }


    /* =========================
       گوشی و تبلت
    ========================= */

    @media (max-width: 768px) {

      .top-bar {
        height: 65px;
      }

      .top-space {
        height: 65px;
      }

      .logo {
        width: 42px;
        max-width: 42px;

        top: 6px;
        right: 20px;
      }

      .wave-section {
        height: 85px;
      }

      .content-inner h1 {
        font-size: 23px;
      }

      .content-inner p {
        font-size: 16px;
      }

    }


    /* =========================
       گوشی کوچک
    ========================= */

    @media (max-width: 480px) {

      .top-bar {
        height: 60px;
      }

      .top-space {
        height: 60px;
      }

      .logo {
        width: 36px;
        max-width: 36px;

        top: 5px;
        right: 15px;
      }

      .wave-section {
        height: 75px;
      }

      .content-inner {
        padding: 30px 15px;
      }

      .content-inner h1 {
        font-size: 21px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       نوار نارنجی ثابت
  ========================== -->

  <header class="top-bar">

    <img
      src="logo.png"
      class="logo"
      alt="مدرسه بین المللی امام صادق (ع)"
    >

  </header>


  <!-- فضای نوار ثابت -->

  <div class="top-space"></div>


  <!-- =========================
       موج‌های غیر ثابت
  ========================== -->

  <section class="wave-section">

    <!-- موج اول -->

    <div class="wave-light"></div>


    <!-- موج دوم -->

    <div class="wave-light-2"></div>


    <!-- موج سفید -->

    <div class="white-wave">

      <svg
        viewBox="0 0 1600 160"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          d="
            M0,65
            C180,80 320,105 500,102
            C700,100 850,78 1040,58
            C1240,38 1410,18 1600,20
            L1600,160
            L0,160
            Z
          "
          fill="#ffffff"
        />

      </svg>

    </div>

  </section>


  <!-- =========================
       محتوای صفحه
  ========================== -->

  <main class="content">

    <div class="content-inner">

      <h1>
        مدرسه بین المللی امام صادق (ع)
      </h1>

      <p>
        به وب‌سایت مدرسه بین المللی امام صادق (ع) خوش آمدید
      </p>


      <!-- فضای اسکرول -->

      <div class="scroll-space"></div>


      <!-- انتهای صفحه -->

      <div class="end-box">
        پایان صفحه
      </div>

    </div>

  </main>


</body>

</html>
