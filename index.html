
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

    }

    body {
      background: #ffffff;

      min-height: 100vh;

      text-align: center;
    }

    .logo {
      width: 220px;
      height: 220px;

      object-fit: contain;

    }

    .school-name {
      color: #1f4e79;

      font-size: 32px;
      font-weight: bold;

    @media (max-width: 600px) {

      .page {
        padding-top: 45px;

      .logo {
        width: 160px;
        height: 160px;

        padding: 0 15px;

</head>
