<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدرسه بین المللی امام صادق (ع)</title>

  <style>

    /* =================================
       تنظیمات اولیه
    ================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      overflow-x: hidden;
    }


    /* =================================
       نوار نارنجی ثابت
    ================================= */

    .top-bar {
      position: fixed;

      top: 0;
      right: 0;

      width: 100%;
      height: 250px;

      background: #E67E22;

      z-index: 9999;
    }


    /* =================================
       لوگو
    ================================= */

    .logo {
      position: absolute;

      top: 12px;
      right: 50px;

      width: 60px;
      max-width: 60px;

      height: auto;

      object-fit: contain;

      z-index: 10000;
    }


    /* =================================
       فضای بالای صفحه
       به اندازه نوار ثابت
    ================================= */

    .top-space {
      width: 100%;
      height: 250px;
    }


    /* =================================
       قسمت موج
       
       این قسمت FIXED نیست
       بنابراین هنگام اسکرول حرکت می‌کند
    ================================= */

    .wave-section {
      position: relative;

      width: 100%;
      height: 110px;

      background: transparent;

      margin-top: -1px;

      z-index: 10;

      overflow: hidden;
    }


    /* =================================
       موج روشن اول
    ================================= */

    .wave-light {
      position: absolute;

      left: -5%;
      bottom: 40px;

      width: 110%;
      height: 90px;

      background: rgba(230, 126, 34, 0.12);

      clip-path: polygon(
        0% 25%,
        12% 40%,
        25% 55%,
        40% 42%,
        55% 58%,
        70% 43%,
        85% 25%,
        100% 35%,
        100% 100%,
        0% 100%
      );

      z-index: 1;
    }


    /* =================================
       موج نارنجی دوم
    ================================= */

    .wave-light-2 {
      position: absolute;

      left: -5%;
      bottom: 15px;

      width: 110%;
      height: 80px;

      background: rgba(230, 126, 34, 0.16);

      clip-path: polygon(
        0% 30%,
        15% 45%,
        30% 35%,
        45% 50%,
        60% 42%,
        75% 30%,
        90% 40%,
        100% 35%,
        100% 100%,
        0% 100%
      );

      z-index: 2;
    }


    /* =================================
       موج سفید
    ================================= */

    .white-wave {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 100%;

      z-index: 5;
    }

    .white-wave svg {
      display: block;

      width: 100%;
      height: 100%;
    }


    /* =================================
       محتوای اصلی
    ================================= */

    .content {
      position: relative;

      width: 100%;

      min-height: 1500px;

      background: #ffffff;

      z-index: 20;
    }


    /* =================================
       نمونه محتوای صفحه
    ================================= */

    .content-inner {
      width: 100%;

      padding: 40px 20px;

      text-align: center;
    }


    /* =================================
       موبایل و تبلت
    ================================= */

    @media (max-width: 768px) {

      .top-bar {
        height: 210px;
      }

      .top-space {
        height: 210px;
      }

      .logo {
        width: 45px;
        max-width: 45px;

        top: 8px;
        right: 20px;
      }

      .wave-section {
        height: 90px;
      }

    }


    /* =================================
       گوشی کوچک
    ================================= */

    @media (max-width: 480px) {

      .top-bar {
        height: 185px;
      }

      .top-space {
        height: 185px;
      }

      .logo {
        width: 38px;
        max-width: 38px;

        top: 7px;
        right: 15px;
      }

      .wave-section {
        height: 75px;
      }

    }

  </style>

</head>


<body>


  <!-- =================================
       نوار نارنجی ثابت
  ================================= -->

  <header class="top-bar">

    <img
      src="logo.png"
      class="logo"
      alt="مدرسه بین المللی امام صادق (ع)"
    >

  </header>


  <!-- =================================
       فضای مربوط به نوار
  ================================= -->

  <div class="top-space"></div>


  <!-- =================================
       موج غیر ثابت
       
       هنگام اسکرول بالا می‌رود
       و از صفحه خارج می‌شود
  ================================= -->

  <section class="wave-section">


    <!-- موج روشن -->

    <div class="wave-light"></div>


    <!-- موج دوم -->

    <div class="wave-light-2"></div>


    <!-- موج سفید -->

    <div class="white-wave">

      <svg
        viewBox="0 0 1600 160"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          d="
            M0,65
            C180,80 320,105 500,102
            C700,100 850,78 1040,58
            C1240,38 1410,18 1600,20
            L1600,160
            L0,160
            Z
          "
          fill="#ffffff"
        />

      </svg>

    </div>


  </section>


  <!-- =================================
       محتوای اصلی سایت
  ================================= -->

  <main class="content">

    <div class="content-inner">

      <!--
        محتوای اصلی سایتت را اینجا قرار بده.
      -->

    </div>

  </main>


</body>

</html>
